on:
  workflow_call:

jobs:
  test-unit:
    runs-on: self-hosted
    timeout-minutes: 20
    name: Test unit

    services:
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3000:3000
        options: >-
          --health-cmd "curl -f http://localhost:3000/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          tools: composer:v2
          coverage: xdebug
        env:
          runner: self-hosted

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: sudo apt install -y poppler-utils postgresql-client

      - name: Restore PHP vendor
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-vendor-${{ hashFiles('**/composer.lock') }}
          fail-on-cache-miss: true

      - name: Restore Node modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          fail-on-cache-miss: true

      - name: Restore Build Assets
        uses: actions/cache@v6
        with:
          path: public/build
          key: ${{ runner.os }}-assets-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Create database
        run: |
          dropdb --if-exists -h localhost -U postgres landlord_test
          createdb -h localhost -U postgres -T template0 landlord_test
        env:
          PGPASSWORD: postgres

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Tests
        run: composer test:unit
        env:
          LARAVEL_PDF_DRIVER: gotenberg
          GOTENBERG_URL: http://localhost:3000
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_CONNECTION: landlord
          DB_TENANT_CONNECTION: tenant
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: landlord_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_CACHE_CONNECTION: landlord
          DB_QUEUE_CONNECTION: landlord
          SESSION_CONNECTION: landlord
          PULSE_DB_CONNECTION: landlord

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            storage/logs/laravel.log
          retention-days: 1
