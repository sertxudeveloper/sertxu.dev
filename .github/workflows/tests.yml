name: complete-workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.ai/**'
      - '.agents/**'
      - '.claude/**'
      - '.cursor/**'
      - '.junie/**'
      - '.run/**'
      - '.github/skills/**'
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**.md'
      - '.ai/**'
      - '.agents/**'
      - '.claude/**'
      - '.cursor/**'
      - '.junie/**'
      - '.run/**'
      - '.github/skills/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-static:
    # Tests always run on main so a deploy can never ship an untested commit.
    if: "github.ref == 'refs/heads/main' || !startsWith(github.event.head_commit.message, '[skip tests]')"
    uses: ./.github/workflows/test-static.yml
    secrets: inherit

  test-analyse:
    if: "github.ref == 'refs/heads/main' || !startsWith(github.event.head_commit.message, '[skip tests]')"
    uses: ./.github/workflows/test-analyse.yml
    secrets: inherit

  test-unit:
    if: "github.ref == 'refs/heads/main' || !startsWith(github.event.head_commit.message, '[skip tests]')"
    uses: ./.github/workflows/test-unit.yml
    secrets: inherit

  deploy:
    needs:
      - test-static
      - test-analyse
      - test-unit
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.test-static.result == 'success' &&
      needs.test-analyse.result == 'success' &&
      needs.test-unit.result == 'success'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
