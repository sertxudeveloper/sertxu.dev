name: Tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: Tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    uses: ./.github/workflows/setup.yml

  test-lint:
    if: "!startsWith(github.event.head_commit.message, '[skip tests]')"
    needs: setup
    uses: ./.github/workflows/test-lint.yml

  test-refactor:
    if: "!startsWith(github.event.head_commit.message, '[skip tests]')"
    needs: setup
    uses: ./.github/workflows/test-refactor.yml

  test-type-coverage:
    if: "!startsWith(github.event.head_commit.message, '[skip tests]')"
    needs: setup
    uses: ./.github/workflows/test-type-coverage.yml

  test-unit:
    if: "!startsWith(github.event.head_commit.message, '[skip tests]')"
    needs: setup
    uses: ./.github/workflows/test-unit.yml
