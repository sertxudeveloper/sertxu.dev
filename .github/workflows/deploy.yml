on:
  workflow_call:


jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve Puppeteer version
        id: puppeteer
        run: |
          echo "version=$(jq -r '.packages["node_modules/puppeteer"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v7.4.0
        with:
            context: .
            file: Dockerfile
            platforms: linux/amd64
            push: true
            pull: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=registry,ref=${{ github.repository }}:buildcache
            cache-to: type=registry,ref=${{ github.repository }}:buildcache,mode=max

  smoke:
    name: Smoke test image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create databases
        run: |
          dropdb --if-exists -h localhost -U postgres test_database
          createdb -h localhost -U postgres -T template0 test_database
        env:
          PGPASSWORD: postgres

      - name: Smoke test the built image
        env:
          # Test the exact manifest that is about to be deployed, not a tag.
          IMAGE: "${{ github.repository }}@${{ needs.build.outputs.digest }}"
          # Minimum acceptable PHP version. Bump when the security floor moves.
          SMOKE_MIN_PHP: 8.5.12
          # The smoke container resolves this inside its own network namespace,
          # so 127.0.0.1 would point at the container itself.
          SMOKE_DB_HOST: host.docker.internal
          SMOKE_DB_PORT: 5432
          SMOKE_DB_DATABASE: test_database
          SMOKE_DB_USERNAME: postgres
          SMOKE_DB_PASSWORD: postgres
        run: bash docker/smoke-test.sh

  deploy:
    name: Deploy to K8s
    needs:
      - build
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Deploy new image
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.KUBERNETES_MASTER_SSH_HOST }}
          username: ${{ secrets.KUBERNETES_MASTER_SSH_USER }}
          port: ${{ secrets.KUBERNETES_MASTER_SSH_PORT }}
          key: ${{ secrets.KUBERNETES_MASTER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            export KUBECONFIG=~/.kube/config

            IMAGE="${{ github.repository }}@${{ needs.build.outputs.digest }}"
            NAMESPACE="sertxudev"

            echo "🚀 Updating deployments to image: $IMAGE"

            # Update all deployments
            kubectl set image deployment/sertxudev-app -n $NAMESPACE sertxudev-app="$IMAGE"
            kubectl set image deployment/sertxudev-worker -n $NAMESPACE sertxudev-worker="$IMAGE"
            kubectl set image deployment/sertxudev-scheduler -n $NAMESPACE sertxudev-scheduler="$IMAGE"

            echo "⏳ Waiting for rollouts to complete..."

            # Wait for each rollout and verify success
            kubectl rollout status deployment/sertxudev-app -n $NAMESPACE --timeout=15m
            kubectl rollout status deployment/sertxudev-worker -n $NAMESPACE --timeout=15m
            kubectl rollout status deployment/sertxudev-scheduler -n $NAMESPACE --timeout=15m

            echo "✅ All deployments successfully rolled out"
