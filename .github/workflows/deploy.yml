name: Build, smoke, and promote image

on:
  workflow_call:

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve Puppeteer version
        id: puppeteer
        run: |
          echo "version=$(jq -r '.packages["node_modules/puppeteer"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Calculate app version
        id: app_version
        run: |
          echo "date=$(git log --pretty="format:%cd" --date="format:%Y.%m.%d %H:%M" -n1 HEAD)" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push candidate image
        id: build-and-push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          # Candidate tag is for smoke testing only; Flux ignores ci-* tags.
          tags: ${{ github.repository }}:ci-${{ github.sha }}
          secrets: |
            RELEASE_SHA="${{ github.sha }}"
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ github.repository }}:buildcache
          cache-to: type=registry,ref=${{ github.repository }}:buildcache,mode=max

  smoke:
    name: Smoke test image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create databases
        run: |
          dropdb --if-exists -h localhost -U postgres test_database
          createdb -h localhost -U postgres -T template0 test_database
        env:
          PGPASSWORD: postgres

      - name: Smoke test the built image
        env:
          # Test the exact manifest that is about to be promoted, not a tag.
          IMAGE: "${{ github.repository }}@${{ needs.build.outputs.digest }}"
          # Minimum acceptable PHP version. Bump when the security floor moves.
          SMOKE_MIN_PHP: 8.5.12
          # The smoke container resolves this inside its own network namespace,
          # so 127.0.0.1 would point at the container itself.
          SMOKE_DB_HOST: host.docker.internal
          SMOKE_DB_PORT: 5432
          SMOKE_DB_DATABASE: test_database
          SMOKE_DB_USERNAME: postgres
          SMOKE_DB_PASSWORD: postgres
        run: bash docker/smoke-test.sh

  promote:
    name: Promote verified image
    needs:
      - build
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Promote smoke-tested digest to Flux-watched tags
        run: |
          set -euo pipefail
          IMAGE="${{ github.repository }}@${{ needs.build.outputs.digest }}"

          echo "Promoting verified image: $IMAGE"
          docker buildx imagetools create \
            --tag "${{ github.repository }}:main-${{ github.run_number }}" \
            --tag "${{ github.repository }}:sha-${{ github.sha }}" \
            "$IMAGE"
